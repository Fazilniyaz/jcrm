# /etc/nginx/sites-available/jadvix
#
# One origin, two upstreams.
#
# The whole CRM is served from http://<ELASTIC_IP>. Nginx is what makes the
# app and the API look like one site: /api/ and /health go to Express, and
# everything else goes to Next. That is not just tidiness — it is what lets the
# refresh cookie work. A cookie is scoped to a SITE, so splitting the two onto
# different hosts (or different ports, for CORS) would mean either a cross-site
# cookie or an allowlist to maintain. Same origin means neither: no preflight,
# no CORS headers in the hot path, SameSite=Lax doing its job.

# The WebSocket upgrade, as a map because this is the only way to express
# "pass Connection: upgrade through, but only when the client asked for it".
# A bare `proxy_set_header Connection upgrade` would claim an upgrade on every
# ordinary request, and the shared proxy params set Connection to "" for the
# keepalive pools — see the /socket.io/ block, which deliberately does not
# include them.
#
# This has to live in the http context, which is where sites-available files
# are included, so it belongs at the top of this file rather than in `server`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream jadvix_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream jadvix_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # `_` matches any Host, which is what you want on a bare IP — there is no
    # name to match, and a request can arrive as the public IP, the private
    # IP, or localhost.
    server_name _;

    # Must be at least as large as the API's UPLOAD_MAX_BYTES, or nginx
    # rejects a big attachment with its own 413 before Express ever sees it
    # and the error will not look like one of ours.
    client_max_body_size 25m;

    # Nginx's own banner, off for the same reason the app turns its off.
    server_tokens off;

    # The uploads route streams a file out of the API. The defaults buffer the
    # whole response before sending a byte, which for a 20 MB attachment means
    # a long silence and then a flood.
    proxy_buffering off;
    proxy_read_timeout 120s;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # --- the API ------------------------------------------------------------
    #
    # Before the catch-all, because nginx picks the LONGEST matching prefix
    # rather than the first one written — but keeping them in this order makes
    # the intent readable to the next person.
    location /api/ {
        proxy_pass http://jadvix_api;
        include /etc/nginx/jadvix-proxy-params;
    }

    # --- realtime -----------------------------------------------------------
    #
    # socket.io shares the API's port. The handshake is ordinary HTTP and then
    # asks to become a WebSocket, which needs the two upgrade headers below —
    # without them nginx answers the upgrade with a 400 and the client falls
    # back to long polling forever, which works but holds a request open per
    # tab.
    #
    # The shared params are NOT included here: they pin Connection to "" for
    # the upstream keepalive pools, and a second proxy_set_header for the same
    # header would be sent alongside rather than replacing it. So this block
    # carries its own full set.
    location /socket.io/ {
        proxy_pass http://jadvix_api;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # An idle socket must outlive the heartbeat, or nginx closes it between
        # pings and the client reconnects every minute. socket.io pings every
        # 25s; this gives it room.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # One line per poll in the access log is noise on a socket that is
        # meant to stay open.
        access_log off;
    }

    # The API's own health check, kept at the root so `curl /health` works the
    # way the backend docs say it does.
    location = /health {
        proxy_pass http://jadvix_api;
        include /etc/nginx/jadvix-proxy-params;
        access_log off;
    }

    # --- the app ------------------------------------------------------------
    #
    # Everything else, including /_next/static. There is deliberately no
    # separate location for the static assets: Next already serves them
    # `public, max-age=31536000, immutable`, and `add_header` here would APPEND
    # a second Cache-Control rather than replace the first. Caching them in
    # nginx would additionally need a `proxy_cache` zone — without one,
    # `proxy_cache_valid` is silently a no-op, which is the kind of line that
    # looks like it is doing something for years.
    location / {
        proxy_pass http://jadvix_app;
        include /etc/nginx/jadvix-proxy-params;
    }
}
